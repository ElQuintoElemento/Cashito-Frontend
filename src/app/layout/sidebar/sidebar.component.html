<aside
  class="flex flex-col h-full bg-sidebar text-sidebar-foreground border-r border-sidebar-border transition-all duration-300"
  [ngClass]="collapsed() ? 'w-16' : 'w-64'"
>

  <!-- HEADER -->
  <div class="flex items-center justify-between h-16 px-4 border-b border-sidebar-border">

    <div *ngIf="!collapsed()" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-primary-foreground">
        <lucide-icon name="credit-card" class="w-4 h-4"></lucide-icon>
      </div>
      <span class="font-semibold text-lg">Cashito</span>
    </div>

    <button appButton variant="ghost" size="icon" (click)="toggleSidebar()" class="ml-auto text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-foreground">
      <lucide-icon [name]="collapsed() ? 'chevron-right' : 'chevron-left'" class="w-4 h-4"></lucide-icon>
    </button>
  </div>

  <!-- NAV -->
  <nav class="flex-1 py-4">
    <ul class="space-y-1.5 px-3">

      <li *ngFor="let item of navItems; trackBy: trackByPath">
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-sidebar-primary text-sidebar-primary-foreground shadow-sm shadow-black/10"
          #rla="routerLinkActive"
          [ngClass]="rla.isActive ? '' : 'text-sidebar-foreground/70 hover:bg-sidebar-accent hover:text-sidebar-foreground'"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200"
        >
          <lucide-icon [name]="item.icon" class="w-5 h-5 flex-shrink-0" [ngClass]="rla.isActive ? 'text-sidebar-primary-foreground' : 'text-sidebar-foreground/60'"></lucide-icon>

          <span *ngIf="!collapsed()" class="text-sm font-medium tracking-wide">
            {{ item.label }}
          </span>
        </a>
      </li>

    </ul>
  </nav>

  <!-- FOOTER -->
  <div class="p-4 border-t border-sidebar-border">
    <div *ngIf="!collapsed()" class="text-xs text-sidebar-foreground/50">
      Cashito v1.0
    </div>
  </div>

</aside>
