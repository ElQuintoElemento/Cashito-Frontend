<header class="h-16 border-b border-border bg-card flex items-center justify-between px-6">

  <!-- LEFT: TITLE -->
  <div class="flex items-center gap-4">
    <h1 class="text-xl font-semibold text-foreground">
      {{ title }}
    </h1>
  </div>

  <!-- RIGHT -->
  <div class="flex items-center gap-4">

    <!-- SEARCH -->
    <div class="relative hidden md:block">
      <lucide-icon name="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></lucide-icon>
      <input
        appInput
        type="text"
        placeholder="Search..."
        userClass="w-64 pl-9 bg-secondary border-0"
      />
    </div>

    <!-- NOTIFICATIONS -->
    <button appButton variant="ghost" size="icon" class="relative">
      <lucide-icon name="bell" class="w-5 h-5"></lucide-icon>
      <span class="absolute top-1 right-1 w-2 h-2 bg-destructive rounded-full"></span>
    </button>

    <!-- USER DROPDOWN -->
    <app-dropdown-menu #userMenu [isOpen]="menuOpen">
      <!-- TRIGGER -->
      <button
        trigger
        appButton
        variant="ghost"
        class="flex items-center gap-2 px-2"
        (click)="userMenu.toggle()"
      >
        <app-avatar userClass="w-8 h-8">
          <app-avatar-fallback class="text-xs bg-primary text-primary-foreground">{{ userInitials }}</app-avatar-fallback>
        </app-avatar>

        <div class="hidden md:block text-left">
          <p class="text-sm font-medium">{{ userName }}</p>
          <p class="text-xs text-muted-foreground">{{ userRole }}</p>
        </div>
      </button>

      <!-- CONTENT -->
      <app-dropdown-label>My Account</app-dropdown-label>
      <app-dropdown-separator></app-dropdown-separator>
      
      <app-dropdown-item>
        <lucide-icon name="user" class="w-4 h-4 mr-2"></lucide-icon> Profile
      </app-dropdown-item>
      <app-dropdown-item>
        <lucide-icon name="settings" class="w-4 h-4 mr-2"></lucide-icon> Settings
      </app-dropdown-item>
      
      <app-dropdown-separator></app-dropdown-separator>
      
      <!-- 💵 CURRENCY -->
      <div class="px-2 py-1">
        <p class="text-xs text-muted-foreground mb-1">Currency</p>
        <app-currency-toggle></app-currency-toggle>
      </div>

      <!-- 🌐 LANGUAGE -->
      <div class="px-2 py-1">
        <app-language-switcher></app-language-switcher>
      </div>

      <!-- 🎨 THEME -->
      <div class="px-2 py-1">
        <p class="text-xs text-muted-foreground mb-1">Theme</p>
        <app-theme-toggle></app-theme-toggle>
      </div>
      
      <app-dropdown-separator></app-dropdown-separator>
      
      <app-dropdown-item [destructive]="true" (click)="logout()">
        <lucide-icon name="log-out" class="w-4 h-4 mr-2"></lucide-icon> Sign out
      </app-dropdown-item>
    </app-dropdown-menu>

  </div>

</header>
