<div *ngIf="open" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-[100] p-4 sm:p-6 animate-in fade-in duration-300">

  <div class="bg-card text-card-foreground w-full max-w-md rounded-xl border border-border/50 shadow-2xl overflow-hidden relative max-h-[95vh] flex flex-col animate-in zoom-in-[0.98] duration-300 ease-out">
    
    <app-modal-close (close)="close.emit()"></app-modal-close>

    <!-- HEADER -->
    <div class="flex flex-col space-y-1.5 p-6 border-b shrink-0">
      <h2 class="text-xl font-semibold leading-none tracking-tight">
        {{ client ? 'Edit Client' : 'Add Client' }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ client ? 'Make changes to your client here.' : 'Enter the details of your new client.' }}
      </p>
    </div>

    <!-- CONTENT -->
    <div class="p-6 space-y-5 overflow-y-auto flex-1">

      <!-- NAMES -->
      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">First Name</label>
          <input
            appInput
            placeholder="John"
            [value]="form().firstName"
            (input)="updateField('firstName', $any($event.target).value)"
          />
        </div>

        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Last Name</label>
          <input
            appInput
            placeholder="Doe"
            [value]="form().lastName"
            (input)="updateField('lastName', $any($event.target).value)"
          />
        </div>
      </div>

      <!-- DNI & PHONE -->
      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">DNI</label>
          <input
            appInput
            placeholder="12345678"
            [value]="form().dni"
            (input)="updateField('dni', $any($event.target).value)"
          />
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Phone</label>
          <input
            appInput
            placeholder="+1 234 567 890"
            [value]="form().phone"
            (input)="updateField('phone', $any($event.target).value)"
          />
        </div>
      </div>

      <!-- EMAIL -->
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none">Email</label>
        <input
          appInput
          placeholder="john.doe@example.com"
          [value]="form().email"
          (input)="updateField('email', $any($event.target).value)"
        />
      </div>

      <!-- INCOME -->
      <div class="grid grid-cols-3 gap-5">
        <div class="col-span-2 space-y-2">
          <label class="text-sm font-medium leading-none">Monthly Income</label>
          <input
            appInput
            type="number"
            placeholder="0.00"
            [value]="form().monthlyIncome"
            (input)="updateField('monthlyIncome', $any($event.target).value)"
          />
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Currency</label>
          <select
            class="flex h-11 w-full items-center justify-between rounded-md border border-input bg-background px-4 py-2 text-sm transition-all duration-200 ease-in-out hover:border-primary/40 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 appearance-none disabled:cursor-not-allowed disabled:opacity-50"
            [value]="form().incomeCurrency"
            (change)="updateField('incomeCurrency', $any($event.target).value)"
          >
            <option value="PEN">PEN</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex items-center justify-end p-6 border-t gap-3 bg-muted/50">
      <button
        appButton
        variant="outline"
        class="bg-transparent hover:bg-secondary/50"
        (click)="close.emit()"
      >
        Cancel
      </button>

      <button
        appButton
        (click)="submit()"
      >
        {{ client ? 'Save changes' : 'Create client' }}
      </button>
    </div>

  </div>

</div>
