<app-modal-shell
  [open]="open"
  [title]="client ? ('clients.modal.editTitle' | translate) : ('clients.modal.addTitle' | translate)"
  [description]="client
  ? ('clients.modal.editDescription' | translate)
  : ('clients.modal.addDescription' | translate)"
  [hasFooter]="true"
  (close)="close.emit()"
>
  <div class="space-y-5 -mt-2">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">{{ 'clients.fields.firstName' | translate }}</label>
        <input
          appInput
          placeholder="John"
          [value]="form().firstName"
          (input)="updateField('firstName', $any($event.target).value)"
        />
      </div>
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">{{ 'clients.fields.lastName' | translate }}</label>
        <input
          appInput
          placeholder="Doe"
          [value]="form().lastName"
          (input)="updateField('lastName', $any($event.target).value)"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">DNI</label>
        <input
          appInput
          placeholder="12345678"
          [value]="form().dni"
          (input)="updateField('dni', $any($event.target).value)"
        />
      </div>
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">{{ 'clients.fields.phone' | translate }}</label>
        <input
          appInput
          placeholder="+1 234 567 890"
          [value]="form().phone"
          (input)="updateField('phone', $any($event.target).value)"
        />
      </div>
    </div>

    <div class="space-y-2">
      <label class="text-sm font-medium leading-none">{{ 'clients.fields.email' | translate }}</label>
      <input
        appInput
        placeholder="{{ 'clients.placeholders.email' | translate }}"
        [value]="form().email"
        (input)="updateField('email', $any($event.target).value)"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
      <div class="sm:col-span-2 space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">{{ 'clients.fields.monthlyIncome' | translate }}</label>
        <input
          appInput
          type="number"
          placeholder="0.00"
          [value]="form().monthlyIncome"
          (input)="updateField('monthlyIncome', $any($event.target).value)"
        />
      </div>
      <app-form-select
        label="{{ 'clients.fields.currency' | translate }}"
        [options]="currencyOptions"
        [value]="form().incomeCurrency"
        (valueChange)="updateField('incomeCurrency', $event)"
      />
    </div>
  </div>

  <div modalFooter class="flex w-full items-center justify-end gap-3">
    <button
      appButton
      variant="outline"
      type="button"
      class="bg-transparent hover:bg-secondary/50"
      (click)="close.emit()"
    >
      {{ 'common.cancel' | translate }}
    </button>
    <button appButton type="button" (click)="submit()">
      {{ client
      ? ('clients.actions.saveChanges' | translate)
      : ('clients.actions.createClient' | translate)
      }}
    </button>
  </div>
</app-modal-shell>
