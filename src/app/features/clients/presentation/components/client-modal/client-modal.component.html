<app-modal-shell
  [open]="open"
  [title]="client ? 'Edit Client' : 'Add Client'"
  [description]="client ? 'Make changes to your client here.' : 'Enter the details of your new client.'"
  [hasFooter]="true"
  (close)="close.emit()"
>
  <div class="space-y-5 -mt-2">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">First Name</label>
        <input
          appInput
          placeholder="John"
          [value]="form().firstName"
          (input)="updateField('firstName', $any($event.target).value)"
        />
      </div>
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">Last Name</label>
        <input
          appInput
          placeholder="Doe"
          [value]="form().lastName"
          (input)="updateField('lastName', $any($event.target).value)"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">DNI</label>
        <input
          appInput
          placeholder="12345678"
          [value]="form().dni"
          (input)="updateField('dni', $any($event.target).value)"
        />
      </div>
      <div class="space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">Phone</label>
        <input
          appInput
          placeholder="+1 234 567 890"
          [value]="form().phone"
          (input)="updateField('phone', $any($event.target).value)"
        />
      </div>
    </div>

    <div class="space-y-2">
      <label class="text-sm font-medium leading-none">Email</label>
      <input
        appInput
        placeholder="john.doe@example.com"
        [value]="form().email"
        (input)="updateField('email', $any($event.target).value)"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
      <div class="sm:col-span-2 space-y-2 min-w-0">
        <label class="text-sm font-medium leading-none">Monthly Income</label>
        <input
          appInput
          type="number"
          placeholder="0.00"
          [value]="form().monthlyIncome"
          (input)="updateField('monthlyIncome', $any($event.target).value)"
        />
      </div>
      <app-form-select
        label="Currency"
        [options]="currencyOptions"
        [value]="form().incomeCurrency"
        (valueChange)="updateField('incomeCurrency', $event)"
      />
    </div>
  </div>

  <div modalFooter class="flex w-full items-center justify-end gap-3">
    <button
      appButton
      variant="outline"
      type="button"
      class="bg-transparent hover:bg-secondary/50"
      (click)="close.emit()"
    >
      Cancel
    </button>
    <button appButton type="button" (click)="submit()">
      {{ client ? 'Save changes' : 'Create client' }}
    </button>
  </div>
</app-modal-shell>
