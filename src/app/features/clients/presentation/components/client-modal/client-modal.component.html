<div *ngIf="open" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50">

  <div class="bg-card text-foreground w-full max-w-md rounded-lg shadow-lg p-6">

    <h2 class="text-lg font-semibold mb-4">
      {{ client ? 'Edit Client' : 'Add Client' }}
    </h2>

    <div class="space-y-4">

      <!-- NAMES -->
      <div class="flex gap-2">
        <input
          placeholder="First Name"
          class="w-full px-3 py-2 bg-secondary rounded"
          [value]="form().firstName"
          (input)="updateField('firstName', $any($event.target).value)"
        />

        <input
          placeholder="Last Name"
          class="w-full px-3 py-2 bg-secondary rounded"
          [value]="form().lastName"
          (input)="updateField('lastName', $any($event.target).value)"
        />
      </div>

      <!-- DNI -->
      <input
        placeholder="DNI"
        class="w-full px-3 py-2 bg-secondary rounded"
        [value]="form().dni"
        (input)="updateField('dni', $any($event.target).value)"
      />

      <!-- INCOME -->
      <input
        type="number"
        placeholder="Monthly Income"
        class="w-full px-3 py-2 bg-secondary rounded"
        [value]="form().monthlyIncome"
        (input)="updateField('monthlyIncome', $any($event.target).value)"
      />

      <!-- INCOME CURRENCY -->
      <select
        class="w-full px-3 py-2 bg-secondary rounded"
        [value]="form().incomeCurrency"
        (change)="updateField('incomeCurrency', $any($event.target).value)"
      >
        <option value="PEN">Soles (PEN)</option>
        <option value="USD">Dólares (USD)</option>
      </select>

      <!-- PHONE -->
      <input
        placeholder="Phone"
        class="w-full px-3 py-2 bg-secondary rounded"
        [value]="form().phone"
        (input)="updateField('phone', $any($event.target).value)"
      />

      <!-- EMAIL -->
      <input
        placeholder="Email"
        class="w-full px-3 py-2 bg-secondary rounded"
        [value]="form().email"
        (input)="updateField('email', $any($event.target).value)"
      />

    </div>

    <!-- ACTIONS -->
    <div class="flex justify-end gap-2 mt-6">

      <button
        (click)="close.emit()"
        class="px-4 py-2 rounded border border-border"
      >
        Cancel
      </button>

      <button
        (click)="submit()"
        class="px-4 py-2 rounded bg-primary text-primary-foreground"
      >
        {{ client ? 'Save' : 'Create' }}
      </button>

    </div>

  </div>

</div>
