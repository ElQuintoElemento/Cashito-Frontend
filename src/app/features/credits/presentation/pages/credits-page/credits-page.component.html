<div class="grid grid-cols-3 gap-6">

  <!-- LIST -->
  <div class="col-span-2">
    <app-credit-list
      [credits]="credits()"
      [clients]="clients()"
      [vehicles]="vehicles()"
      (view)="selectCredit($event)"
    />
  </div>

  <!-- DETAIL -->
  <div class="col-span-1">
    <app-credit-detail
      [credit]="selected()"
      [schedule]="schedule()"
      [clients]="clients()"
      [vehicles]="vehicles()"
      (close)="closeDetail()"
    />
  </div>

</div>
