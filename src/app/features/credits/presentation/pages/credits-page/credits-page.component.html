<div class="h-full flex flex-col space-y-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <div class="space-y-1">
      <h2 class="text-3xl font-bold tracking-tight">Credits</h2>
      <p class="text-sm text-muted-foreground">Manage and track all active, pending, and completed credit applications.</p>
    </div>
  </div>

  <!-- LIST -->
  <app-credit-list
    [credits]="credits()"
    [clients]="clients()"
    [vehicles]="vehicles()"
    (view)="selectCredit($event)"
  />

  <!-- DETAIL MODAL -->
  <div *ngIf="selected()" class="fixed inset-0 flex items-center justify-center bg-black/60 z-50 animate-in fade-in duration-200 p-4 sm:p-6 md:p-12">
    <div class="bg-card text-card-foreground w-full max-w-7xl h-full max-h-[90vh] rounded-xl border shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col relative">
      
      <!-- Close Button -->
      <button 
        (click)="closeDetail()" 
        class="absolute right-4 top-4 w-8 h-8 flex items-center justify-center rounded-full bg-muted/50 hover:bg-muted text-muted-foreground hover:text-foreground transition-colors z-10"
      >
        <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
      </button>

      <!-- DETAIL CONTENT -->
      <app-credit-detail
        [credit]="selected()"
        [schedule]="schedule()"
        [clients]="clients()"
        [vehicles]="vehicles()"
        (close)="closeDetail()"
        class="flex-1 overflow-hidden flex flex-col"
      />

    </div>
  </div>

</div>
