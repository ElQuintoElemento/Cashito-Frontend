<div class="h-full flex flex-col pb-6">

  <!-- LIST -->
  <app-credit-list
    [credits]="credits()"
    [clients]="clients()"
    [vehicles]="vehicles()"
    (view)="selectCredit($event)"
  />

  <!-- DETAIL MODAL -->
  <div *ngIf="selected()" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-[100] p-4 sm:p-6 md:p-12 animate-in fade-in duration-300">
    <div class="bg-card text-card-foreground w-full max-w-7xl h-full max-h-[90vh] rounded-xl border border-border/50 shadow-2xl overflow-hidden animate-in zoom-in-[0.98] duration-300 ease-out flex flex-col relative">
      
      <!-- Close Button -->
      <app-modal-close (close)="closeDetail()"></app-modal-close>

      <!-- DETAIL CONTENT -->
      <app-credit-detail
        [credit]="selected()"
        [schedule]="schedule()"
        [clients]="clients()"
        [vehicles]="vehicles()"
        (close)="closeDetail()"
        class="flex-1 overflow-hidden flex flex-col"
      />

    </div>
  </div>

</div>
