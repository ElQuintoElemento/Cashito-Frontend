<div class="space-y-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <div class="space-y-1">
      <h2 class="text-3xl font-bold tracking-tight">Vehicles</h2>
      <p class="text-sm text-muted-foreground">Manage your vehicle catalog and inventory.</p>
    </div>

    <div class="flex items-center gap-4">
      <div class="relative w-72 hidden md:block">
        <lucide-icon name="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"></lucide-icon>
        <input
          appInput
          placeholder="Search vehicles..."
          userClass="pl-9 bg-background"
          (input)="search.set($any($event.target).value)"
        />
      </div>

      <button
        appButton
        (click)="openCreate()"
      >
        <lucide-icon name="plus" class="w-4 h-4 mr-2"></lucide-icon>
        Add Vehicle
      </button>
    </div>
  </div>

  <!-- TABLE CARD -->
  <app-card>
    <div class="p-1">
      <app-vehicles-table
        [vehicles]="vehicles()"
        (edit)="openEdit($event)"
        (delete)="delete($event)"
      />
    </div>
  </app-card>

</div>

<app-vehicle-modal
  [open]="modalOpen()"
  [vehicle]="editing()"
  (save)="save($event)"
  (close)="modalOpen.set(false)"
/>
