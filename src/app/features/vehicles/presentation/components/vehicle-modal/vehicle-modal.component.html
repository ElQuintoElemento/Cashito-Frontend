<div *ngIf="open" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 animate-in fade-in duration-200">

  <div class="bg-card text-card-foreground w-full max-w-md rounded-lg border shadow-lg overflow-hidden animate-in zoom-in-95 duration-200">

    <!-- HEADER -->
    <div class="flex flex-col space-y-1.5 p-6 border-b">
      <h2 class="text-xl font-semibold leading-none tracking-tight">
        {{ vehicle ? 'Edit Vehicle' : 'Add Vehicle' }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ vehicle ? 'Update the details of this vehicle.' : 'Enter the details of the new vehicle to add it to the catalog.' }}
      </p>
    </div>

    <!-- CONTENT -->
    <div class="p-6 space-y-4">

      <!-- BRAND & MODEL -->
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Brand</label>
          <input
            appInput
            placeholder="Toyota"
            [value]="form().brand"
            (input)="updateField('brand', $any($event.target).value)"
          />
        </div>

        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Model</label>
          <input
            appInput
            placeholder="Corolla"
            [value]="form().model"
            (input)="updateField('model', $any($event.target).value)"
          />
        </div>
      </div>

      <!-- TYPE & YEAR -->
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Type</label>
          <select
            class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
            [value]="form().type"
            (change)="updateField('type', $any($event.target).value)"
          >
            <option value="">Select type</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Pickup">Pickup</option>
            <option value="Motorcycle">Motorcycle</option>
          </select>
        </div>
        
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Year</label>
          <input
            appInput
            type="number"
            placeholder="2024"
            [value]="form().year"
            (input)="updateField('year', $any($event.target).value)"
          />
        </div>
      </div>

      <!-- PRICE & CURRENCY -->
      <div class="grid grid-cols-3 gap-4">
        <div class="col-span-2 space-y-2">
          <label class="text-sm font-medium leading-none">Price</label>
          <input
            appInput
            type="number"
            placeholder="0.00"
            [value]="form().price"
            (input)="updateField('price', $any($event.target).value)"
          />
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Currency</label>
          <select
            class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
            [value]="form().currency"
            (change)="updateField('currency', $any($event.target).value)"
          >
            <option value="PEN">PEN</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex items-center justify-end p-6 border-t gap-2 bg-muted/50">
      <button
        appButton
        variant="outline"
        (click)="close.emit()"
      >
        Cancel
      </button>

      <button
        appButton
        (click)="submit()"
      >
        {{ vehicle ? 'Save changes' : 'Create vehicle' }}
      </button>
    </div>

  </div>

</div>
