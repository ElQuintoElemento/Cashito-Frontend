<div *ngIf="open" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-[100] p-4 sm:p-6 animate-in fade-in duration-300">

  <div class="bg-card text-card-foreground w-full max-w-md rounded-xl border border-border/50 shadow-2xl overflow-hidden relative max-h-[95vh] flex flex-col animate-in zoom-in-[0.98] duration-300 ease-out">
    
    <app-modal-close (close)="close.emit()"></app-modal-close>

    <!-- HEADER -->
    <div class="flex flex-col space-y-1.5 p-6 border-b shrink-0">
      <h2 class="text-xl font-semibold leading-none tracking-tight">
        {{ vehicle ? 'Edit Vehicle' : 'Add Vehicle' }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ vehicle ? 'Update the details of this vehicle.' : 'Enter the details of the new vehicle to add it to the catalog.' }}
      </p>
    </div>

    <!-- CONTENT -->
    <div class="p-6 space-y-5 overflow-y-auto flex-1">

      <!-- BRAND & MODEL -->
      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Brand</label>
          <input
            appInput
            placeholder="Toyota"
            [value]="form().brand"
            (input)="updateField('brand', $any($event.target).value)"
          />
        </div>

        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Model</label>
          <input
            appInput
            placeholder="Corolla"
            [value]="form().model"
            (input)="updateField('model', $any($event.target).value)"
          />
        </div>
      </div>

      <!-- TYPE & YEAR -->
      <div class="grid grid-cols-2 gap-5">
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Type</label>
          <select
            class="flex h-11 w-full items-center justify-between rounded-md border border-input bg-background px-4 py-2 text-sm transition-all duration-200 ease-in-out hover:border-primary/40 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 appearance-none"
            [value]="form().type"
            (change)="updateField('type', $any($event.target).value)"
          >
            <option value="">Select type</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Pickup">Pickup</option>
            <option value="Motorcycle">Motorcycle</option>
          </select>
        </div>
        
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Year</label>
          <input
            appInput
            type="number"
            placeholder="2024"
            [value]="form().year"
            (input)="updateField('year', $any($event.target).value)"
          />
        </div>
      </div>

      <!-- PRICE & CURRENCY -->
      <div class="grid grid-cols-3 gap-5">
        <div class="col-span-2 space-y-2">
          <label class="text-sm font-medium leading-none">Price</label>
          <input
            appInput
            type="number"
            placeholder="0.00"
            [value]="form().price"
            (input)="updateField('price', $any($event.target).value)"
          />
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium leading-none">Currency</label>
          <select
            class="flex h-11 w-full items-center justify-between rounded-md border border-input bg-background px-4 py-2 text-sm transition-all duration-200 ease-in-out hover:border-primary/40 focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 appearance-none"
            [value]="form().currency"
            (change)="updateField('currency', $any($event.target).value)"
          >
            <option value="PEN">PEN</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex items-center justify-end p-6 border-t gap-3 bg-muted/50">
      <button
        appButton
        variant="outline"
        class="bg-transparent hover:bg-secondary/50"
        (click)="close.emit()"
      >
        Cancel
      </button>

      <button
        appButton
        (click)="submit()"
      >
        {{ vehicle ? 'Save changes' : 'Create vehicle' }}
      </button>
    </div>

  </div>

</div>
