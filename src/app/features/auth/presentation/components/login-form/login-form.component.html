<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

  <h2 class="text-2xl font-semibold text-foreground">
    Login
  </h2>

  <p class="text-sm text-muted-foreground">
    Enter your credentials
  </p>

  <!-- USERNAME -->
  <input
    type="text"
    placeholder="Username"
    formControlName="username"
    class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
  />

  <!-- PASSWORD -->
  <input
    type="password"
    placeholder="Password"
    formControlName="password"
    class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
  />

  <!-- ERROR -->
  <p *ngIf="error" class="text-sm text-destructive">
    {{ error }}
  </p>

  <!-- BUTTON -->
  <button
    type="submit"
    [disabled]="loading"
    class="w-full py-2 rounded-md bg-primary text-primary-foreground hover:opacity-90 transition"
  >
    {{ loading ? 'Loading...' : 'Sign in' }}
  </button>

  <p class="text-sm text-center text-muted-foreground">
    Don’t have an account?
    <a routerLink="/auth/register" class="text-primary hover:underline">
      Register
    </a>
  </p>

</form>
