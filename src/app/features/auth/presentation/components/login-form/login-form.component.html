<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-7 w-full rounded-2xl border border-border/60 bg-card/80 p-6 shadow-xl shadow-black/5 sm:p-8">

  <div class="space-y-3 text-center lg:text-left">
    <h2 class="text-3xl font-semibold tracking-tight text-foreground">
      Welcome back
    </h2>
    <p class="text-sm leading-6 text-muted-foreground">
      Enter your credentials to access your account
    </p>
  </div>

  <div class="space-y-5">
    <!-- USERNAME -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Username</label>
      <div class="relative">
        <lucide-icon name="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-muted-foreground/70 pointer-events-none"></lucide-icon>
        <input
          appInput
          type="text"
          placeholder="Enter your username"
          formControlName="username"
          userClass="h-12 rounded-lg bg-background/80 pl-12 pr-4 shadow-sm"
          [attr.disabled]="loading ? true : null"
        />
      </div>
      <p *ngIf="form.get('username')?.touched && form.get('username')?.invalid" class="text-xs text-destructive mt-1">
        Username is required.
      </p>
    </div>

    <!-- PASSWORD -->
    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Password</label>
        <a href="#" class="text-xs font-medium text-primary hover:underline" (click)="$event.preventDefault()">Forgot password?</a>
      </div>
      <div class="relative">
        <lucide-icon name="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-muted-foreground/70 pointer-events-none"></lucide-icon>
        <input
          appInput
          type="password"
          placeholder="••••••••"
          formControlName="password"
          userClass="h-12 rounded-lg bg-background/80 pl-12 pr-4 shadow-sm"
          [attr.disabled]="loading ? true : null"
        />
      </div>
      <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-xs text-destructive mt-1">
        Password is required.
      </p>
    </div>
  </div>

  <!-- ERROR -->
  <div *ngIf="error" class="p-3 rounded-md bg-destructive/10 border border-destructive/20 text-sm text-destructive flex items-center gap-2 animate-in fade-in duration-200">
    <lucide-icon name="alert-circle" class="w-4 h-4"></lucide-icon>
    {{ error }}
  </div>

  <!-- BUTTON -->
  <button
    appButton
    type="submit"
    class="w-full h-12 text-base mt-2 shadow-sm gap-2"
    [disabled]="loading || form.invalid"
  >
    <lucide-icon *ngIf="loading" name="loader-2" class="w-4 h-4 mr-2 animate-spin"></lucide-icon>
    {{ loading ? 'Signing in...' : 'Sign in' }}
  </button>

  <p class="text-sm text-center text-muted-foreground mt-4">
    Don’t have an account?
    <a routerLink="/auth/register" class="font-medium text-primary hover:text-primary/80 transition-colors">
      Create an account
    </a>
  </p>

</form>
