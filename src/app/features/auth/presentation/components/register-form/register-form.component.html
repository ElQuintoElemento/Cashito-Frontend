<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-8 w-full">

  <div class="space-y-3 text-center lg:text-left mb-2">
    <h2 class="text-3xl font-semibold tracking-tight text-foreground">
      Create an account
    </h2>
    <p class="text-sm text-muted-foreground">
      Enter your details below to get started
    </p>
  </div>

  <div class="space-y-5">
    <!-- FIRST & LAST NAME -->
    <div class="grid grid-cols-2 gap-5">
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">First Name</label>
        <div class="relative">
          <lucide-icon name="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-muted-foreground/70"></lucide-icon>
          <input
            appInput
            type="text"
            placeholder="John"
            formControlName="firstName"
            userClass="pl-10"
            [attr.disabled]="loading ? true : null"
          />
        </div>
      </div>
      <div class="space-y-2">
        <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Last Name</label>
        <div class="relative">
          <input
            appInput
            type="text"
            placeholder="Doe"
            formControlName="lastName"
            [attr.disabled]="loading ? true : null"
          />
        </div>
      </div>
    </div>

    <!-- USERNAME -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Username</label>
      <div class="relative">
        <lucide-icon name="at-sign" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-muted-foreground/70"></lucide-icon>
        <input
          appInput
          type="text"
          placeholder="johndoe"
          formControlName="username"
          userClass="pl-10"
          [attr.disabled]="loading ? true : null"
        />
      </div>
    </div>

    <!-- EMAIL -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email Address</label>
      <div class="relative">
        <lucide-icon name="mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-muted-foreground/70"></lucide-icon>
        <input
          appInput
          type="email"
          placeholder="m@example.com"
          formControlName="email"
          userClass="pl-10"
          [attr.disabled]="loading ? true : null"
        />
      </div>
    </div>

    <!-- PASSWORD -->
    <div class="space-y-2">
      <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Password</label>
      <div class="relative">
        <lucide-icon name="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-[18px] h-[18px] text-muted-foreground/70"></lucide-icon>
        <input
          appInput
          type="password"
          placeholder="••••••••"
          formControlName="password"
          userClass="pl-10"
          [attr.disabled]="loading ? true : null"
        />
      </div>
      <p class="text-[11px] text-muted-foreground mt-1.5">Must be at least 8 characters long.</p>
    </div>
  </div>

  <!-- ERROR -->
  <div *ngIf="error" class="p-3 rounded-md bg-destructive/10 border border-destructive/20 text-sm text-destructive flex items-center gap-2 animate-in fade-in duration-200">
    <lucide-icon name="alert-circle" class="w-4 h-4"></lucide-icon>
    {{ error }}
  </div>

  <!-- BUTTON -->
  <button
    appButton
    type="submit"
    class="w-full h-12 text-base mt-2 shadow-sm"
    [disabled]="loading || form.invalid"
  >
    <lucide-icon *ngIf="loading" name="loader-2" class="w-4 h-4 mr-2 animate-spin"></lucide-icon>
    {{ loading ? 'Creating account...' : 'Create account' }}
  </button>

  <p class="text-sm text-center text-muted-foreground mt-4">
    Already have an account?
    <a routerLink="/auth/login" class="font-medium text-primary hover:text-primary/80 transition-colors">
      Sign in
    </a>
  </p>

</form>
