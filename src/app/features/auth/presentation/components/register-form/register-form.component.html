<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

  <h2 class="text-2xl font-semibold text-foreground">
    Register
  </h2>

  <div class="flex gap-2">
    <input formControlName="firstName" placeholder="Firstname"
           class="w-full px-3 py-2 rounded-md bg-secondary text-foreground" />

    <input formControlName="lastName" placeholder="Lastname"
           class="w-full px-3 py-2 rounded-md bg-secondary text-foreground" />
  </div>

  <input formControlName="username" placeholder="Username"
         class="w-full px-3 py-2 rounded-md bg-secondary text-foreground" />

  <input formControlName="email" placeholder="Email"
         class="w-full px-3 py-2 rounded-md bg-secondary text-foreground" />

  <input type="password" formControlName="password" placeholder="Password"
         class="w-full px-3 py-2 rounded-md bg-secondary text-foreground" />

  <p *ngIf="error" class="text-sm text-destructive">
    {{ error }}
  </p>

  <button type="submit"
          class="w-full py-2 rounded-md bg-primary text-primary-foreground">
    Create Account
  </button>

  <p class="text-sm text-center text-muted-foreground">
    Already have an account?
    <a routerLink="/auth/login" class="text-primary">Sign in</a>
  </p>

</form>
