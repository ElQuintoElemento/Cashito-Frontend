<form class="flex flex-col gap-4">

  <h2 class="text-2xl font-semibold text-foreground flex items-center gap-2">
    <span class="w-3 h-3 rounded-full bg-primary"></span>
    Register
  </h2>

  <p class="text-sm text-muted-foreground">
    Signup now and get full access to the app.
  </p>

  <!-- NAMES -->
  <div class="flex gap-2">
    <input
      type="text"
      placeholder="Firstname"
      class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
    />

    <input
      type="text"
      placeholder="Lastname"
      class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
    />
  </div>

  <!-- EMAIL -->
  <input
    type="email"
    placeholder="Email"
    class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
  />

  <!-- PASSWORD -->
  <input
    type="password"
    placeholder="Password"
    class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
  />

  <input
    type="password"
    placeholder="Confirm password"
    class="w-full px-3 py-2 rounded-md bg-secondary text-foreground outline-none"
  />

  <!-- BUTTON -->
  <button
    class="w-full py-2 rounded-md bg-primary text-primary-foreground hover:opacity-90 transition"
  >
    Create Account
  </button>

  <!-- LOGIN LINK -->
  <p class="text-sm text-center text-muted-foreground">
    Already have an account?
    <a routerLink="/auth/login" class="text-primary hover:underline">
      Sign in
    </a>
  </p>

</form>
