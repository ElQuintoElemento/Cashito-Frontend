<div class="min-h-screen w-full flex flex-col bg-background relative overflow-hidden items-center justify-center p-6">
  
  <!-- Abstract Background Elements -->
  <div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
    <div class="absolute w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px] transform -translate-y-1/4"></div>
    <div class="absolute w-[500px] h-[500px] bg-cyan-500/5 rounded-full blur-[80px] transform translate-x-1/3 translate-y-1/4"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center text-center max-w-2xl animate-in zoom-in-95 duration-700">
    
    <div class="mb-8">
      <app-logo variant="icon" [iconSize]="64" containerClass="shadow-2xl shadow-primary/20"></app-logo>
    </div>

    <h1 class="text-9xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-foreground to-muted-foreground mb-4">
      404
    </h1>
    
    <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-foreground mb-4">
      Page not found
    </h2>
    
    <p class="text-lg text-muted-foreground mb-10 max-w-lg leading-relaxed">
      We couldn't find the page you're looking for. It might have been moved, deleted, or never existed in the first place.
    </p>

    <div class="flex flex-col sm:flex-row gap-4">
      <a routerLink="/app" appButton class="h-12 px-8 text-base shadow-lg shadow-primary/20">
        <lucide-icon name="arrow-left" class="w-5 h-5 mr-2"></lucide-icon>
        Return to Dashboard
      </a>
    </div>

  </div>

</div>
